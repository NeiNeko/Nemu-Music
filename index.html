const $=s=>document.querySelector(s), audio=$('#audio'), play=$('#play'), seek=$('#seek'), viz=$('#viz'), pipBtn=$('#pipBtn');

async function connectRealAudio(){
 try{

}

const vizLevels=new Array(64).fill(.035);
const vizTargets=new Array(64).fill(.035);
const vizBias=Array.from({length:64},(_,i)=>.72+(((i*47+13)%37)/36)*.42);
let vizLastShape=0, vizPrevEnergy=0;
function draw(now=performance.now()){
 requestAnimationFrame(draw);
 let playing=ytReady&&ytPlayer&&ytPlayer.getPlayerState()===YT.PlayerState.PLAYING;
 if(captureActive&&analyser&&captureData){
  analyser.getByteFrequencyData(captureData);
  const n=captureData.length, hi=Math.min(n-1,96);
  // 화면 위치와 주파수 위치를 완전히 분리한다. 전체 오디오 에너지로만 반응 강도를 정한다.
  let sum=0,weighted=0,weightSum=0,peak=0;
  for(let k=1;k<=hi;k++){
   const x=captureData[k]/255;
   sum+=x*x;
   const w=k<18?1.55:(k<45?1.18:.82); // 킥/중역의 박자감을 조금 더 반영
   weighted+=x*w; weightSum+=w;
   if(x>peak)peak=x;
  }
  const rms=Math.sqrt(sum/hi);
  const body=weighted/weightSum;
  let energy=Math.min(1,Math.pow(rms*.62+body*.50+peak*.10,.72));
  const onset=Math.max(0,energy-vizPrevEnergy);
  vizPrevEnergy=vizPrevEnergy*.52+energy*.48;
  const punch=Math.min(1,energy+onset*2.6);

  // 약 30fps마다 64개 막대의 모양을 독립적으로 다시 만든다.
  // 양 끝을 포함해 어느 막대든 같은 확률로 크게 솟을 수 있다.
  if(now-vizLastShape>32){
   vizLastShape=now;
   for(let i=0;i<bars.length;i++){
    const r1=Math.random(), r2=Math.random();
    const irregular=Math.pow(r1,.72)*.72 + Math.pow(r2,2.2)*.28;
    const floor=.035 + Math.random()*.025;
    const shared=punch*(.28+Math.random()*.20);
    const individual=punch*irregular*vizBias[i]*.92;
    vizTargets[i]=Math.min(.99,floor+shared+individual);
    // 강한 박자에서는 임의의 막대들이 거의 끝까지 튀도록 한다.
    if(onset>.055 && Math.random()<.30)vizTargets[i]=Math.max(vizTargets[i],.72+Math.random()*.27);
   }
  }
  for(let i=0;i<bars.length;i++){
   const target=vizTargets[i];
   const rate=target>vizLevels[i]?.93:.76;
   vizLevels[i]+=(target-vizLevels[i])*rate;
   const h=Math.max(.025,Math.min(.99,vizLevels[i]));
   bars[i].style.height=(h*100)+'%';
   bars[i].style.opacity=String(Math.min(1,.48+h*.62));
  }
 }else{
  vizPrevEnergy=0;
  bars.forEach((b,i)=>{const target=playing?.055:.025;vizLevels[i]+=(target-vizLevels[i])*.45;vizTargets[i]=target;b.style.height=(vizLevels[i]*100)+'%';b.style.opacity=playing?.45:.28});
 }
}
draw();
play.onclick=()=>{let s=songs[idx];if(!s)return;if(!ytReady)return showYtError('YouTube 플레이어를 불러오는 중이야.');ytPlayer.getPlayerState()===YT.PlayerState.PLAYING?ytPlayer.pauseVideo():ytPlayer.playVideo()};audio.onplay=()=>play.textContent='❚❚';audio.onpause=()=>play.textContent='▶';audio.ontimeupdate=syncUI;audio.onended=handleEnded;seek.oninput=()=>{let d=mediaDuration(),t=seek.value/100*d;if(ytReady&&d)ytPlayer.seekTo(t,true)};
function goNext(){if(!songs.length)return;load((idx+1)%songs.length)}
function handleEnded(){if(repeatMode==='one'){load(idx).then(()=>setTimeout(()=>play.click(),100));return}if(repeatMode==='off'&&idx===songs.length-1)return;load((idx+1)%songs.length).then(()=>setTimeout(()=>play.click(),100))}
$('#prev').onclick=()=>songs.length&&load((idx-1+songs.length)%songs.length);$('#next').onclick=goNext;
async function shuffleSongOrder(){
 if(songs.length<2)return;
 let currentId=songs[idx]?.id;
 for(let i=songs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[songs[i],songs[j]]=[songs[j],songs[i]]}
 for(let i=0;i<songs.length;i++){songs[i].order=i;await dbPut(songs[i])}
 idx=currentId==null?-1:songs.findIndex(x=>x.id===currentId);page=0;applyFilter();
 let btn=$('#shuffleBtn');btn.textContent='✓';setTimeout(()=>btn.textContent='🔀',500)
}
function updateModes(){$('#repeatBtn').textContent=repeatMode==='one'?'🔂':repeatMode==='all'?'🔁':'↪'}
$('#shuffleBtn').onclick=shuffleSongOrder;
$('#repeatBtn').onclick=()=>{repeatMode=repeatMode==='off'?'all':repeatMode==='all'?'one':'off';localStorage.setItem('nemuRepeat',repeatMode);updateModes()};
async function openPip(){if(!('documentPictureInPicture'in window))return alert('최신 Chrome/Edge에서 커스텀 PiP를 사용할 수 있어.');if(pipWin&&!pipWin.closed)return pipWin.focus();pipWin=await documentPictureInPicture.requestWindow({width:430,height:540});pipWin.document.head.innerHTML=`<style>body{margin:0;padding:22px;font-family:sans-serif;background:#f6f1dc;color:#38372f}.c{background:#fffaf0;padding:22px;border-radius:26px}.h{display:flex;gap:14px;align-items:center}.h img{width:68px;height:68px;border-radius:16px;object-fit:cover}.l{text-align:center;padding:45px 8px}.p,.x{opacity:.3}.n{font-size:23px;font-weight:800;margin:18px 0}.tr{display:block;margin-top:7px;font-size:15px;font-weight:500;line-height:1.45;opacity:.62}.ctrl{display:flex;justify-content:center;gap:12px}.ctrl button{border:0;border-radius:50%;width:46px;height:46px;background:white}.ctrl .y{background:#72825b;color:white}</style>`;pipWin.document.body.innerHTML=`<div class=c><div class=h><img id=pc><div><b id=pt>NEMU MUSIC</b><div id=pa></div></div></div><div class=l><div id=lp class=p></div><div id=ln class=n>♪</div><div id=lx class=x></div></div><div class=ctrl><button id=pp>◀</button><button id=py class=y>▶</button><button id=pn>▶</button></div></div>`;pipWin.document.querySelector('#pp').onclick=()=>$('#prev').click();pipWin.document.querySelector('#pn').onclick=()=>$('#next').click();pipWin.document.querySelector('#py').onclick=()=>play.click();syncPipSong();syncPip()}
function syncPipSong(){if(!pipWin||pipWin.closed)return;let s=songs[idx]||{},d=pipWin.document;d.querySelector('#pt').textContent=s.title||'NEMU MUSIC';d.querySelector('#pa').textContent=s.artist||'';d.querySelector('#pc').src=s.cover||(s.youtubeId?'https://i.ytimg.com/vi/'+s.youtubeId+'/mqdefault.jpg':'')}
function syncPip(){if(!pipWin||pipWin.closed)return;let ls=parseLRC(songs[idx]?.lyrics),n=-1,t=mediaTime();ls.forEach((l,i)=>{if(t>=l.time)n=i});let d=pipWin.document;let lyricHtml=l=>l?esc(l.text||'♪')+(l.translation?'<span class=\"tr\">'+esc(l.translation)+'</span>':''):'';d.querySelector('#lp').innerHTML=n>0?lyricHtml(ls[n-1]):'';d.querySelector('#ln').innerHTML=n>=0?lyricHtml(ls[n]):'♪';d.querySelector('#lx').innerHTML=n+1<ls.length?lyricHtml(ls[n+1]):'';d.querySelector('#py').textContent=mediaPaused()?'▶':'❚❚'}pipBtn.onclick=openPip;
(async()=>{await openDB();/* migrate old localStorage library once */let old=JSON.parse(localStorage.getItem('nemuSongs')||'[]');if(old.length && !(await dbAll()).length){for(let s of old)await dbPut({...s,added:Date.now()});localStorage.setItem('nemuMigrated','1')}await refresh();updateModes()})().catch(e=>{$('#stats').textContent='IndexedDB를 열지 못했어: '+e.message});
</script></body></html>
