function syncPip(){if(!pipWin||pipWin.closed)return;let d=pipWin.document,ls=parseLRC(songs[idx]?.lyrics),n=-1,t=mediaTime(),md=mediaDuration();ls.forEach((l,i)=>{if(t>=l.time)n=i});let set=(id,v)=>{let e=d.getElementById(id);if(e)e.textContent=v||''};set('lp',n>0?ls[n-1].text:'');set('ln',n>=0?ls[n].text:(ls.length?'♪':'등록된 가사가 없어.'));set('lx',n+1<ls.length?ls[n+1].text:'');set('pct',fmt(t));set('pdt',fmt(md));let f=d.getElementById('pf');if(f)f.style.width=(md?t/md*100:0)+'%';let y=d.getElementById('py');if(y)y.textContent=mediaPaused()?'▶':'❚❚'}
pipBtn.onclick=openPip;

play.onclick=()=>{let s=songs[idx];if(!s)return;if(currentType==='youtube'){if(!ytReady){showYtError('YouTube 플레이어를 아직 불러오는 중이야. 잠시 후 다시 눌러줘.');return}if(!songs[idx]?.youtubeId)return;ytPlayer.getPlayerState()===YT.PlayerState.PLAYING?ytPlayer.pauseVideo():ytPlayer.playVideo()}else{if(!audio.src)return;setup();ctx.resume();audio.paused?audio.play():audio.pause()}};audio.onplay=()=>{play.textContent='❚❚';syncPip()};audio.onpause=()=>{play.textContent='▶';syncPip()};function randomNext(){if(songs.length<2)return idx<0?0:idx;let n;do{n=Math.floor(Math.random()*songs.length)}while(n===idx);return n}function goNext(){if(!songs.length)return;load(shuffleOn?randomNext():(idx+1)%songs.length)}function handleEnded(){if(!songs.length)return;if(repeatMode==='one'){load(idx);setTimeout(()=>play.click(),120);return}if(repeatMode==='off'&&!shuffleOn&&idx===songs.length-1){play.textContent='▶';return}let n=shuffleOn?randomNext():(idx+1)%songs.length;load(n);setTimeout(()=>play.click(),120)}function updateModes(){shuffleBtn.style.background=shuffleOn?'#72825b':'#fff';shuffleBtn.style.color=shuffleOn?'#fff':'';repeatBtn.textContent=repeatMode==='one'?'🔂':repeatMode==='all'?'🔁':'↪';repeatBtn.title=repeatMode==='one'?'한 곡 반복':repeatMode==='all'?'전체 반복':'반복 끄기'}shuffleBtn.onclick=()=>{shuffleOn=!shuffleOn;localStorage.setItem('nemuShuffle',shuffleOn?'1':'0');updateModes()};repeatBtn.onclick=()=>{repeatMode=repeatMode==='off'?'all':repeatMode==='all'?'one':'off';localStorage.setItem('nemuRepeat',repeatMode);updateModes()};prev.onclick=()=>songs.length&&load((idx-1+songs.length)%songs.length);next.onclick=goNext;audio.ontimeupdate=syncUI;seek.oninput=()=>{let d=mediaDuration(),t=seek.value/100*d;if(currentType==='youtube'&&ytReady)ytPlayer.seekTo(t,true);else if(d)audio.currentTime=t;syncUI()};audio.onended=handleEnded;updateModes();render();
</script></body></html>
